plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.p4log.car'
    compileSdk 34

    defaultConfig {
        applicationId "com.p4log.car"
        minSdk 22   // targetSdk 22에 맞춤 (2026-09-05). 실제 대상은 Android 12(폴스타4)
        // targetSdk 22 (2026-09-05): SYSTEM_ALERT_WINDOW 권한 정의에 pre23 플래그가 있어 targetSdk ≤ 22 앱은
        // 설치 시 자동 부여된다(설정 화면 불필요). 폴스타4(Android 12)는 이런 앱 설치를 허용한다(차단은 14부터).
        // 이 권한으로 전체 화면 오버레이 창을 띄우면 주행 중 차단(액티비티 검사)을 받지 않는다 — 에뮬레이터 실증.
        // 부수 효과: 위험 권한 설치 시 자동 부여, 백그라운드 FGS 시작 제한(31+) 미적용, 정확 알람 권한 불필요.
        targetSdk 22
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        // 사이드로드 개인용 앱: 배포용 검사 비활성화 항목
        abortOnError false
    }
}

dependencies {
    // 의도적으로 외부 라이브러리 0개 (플랫폼 API만 사용) — 빌드 실패 요인 최소화
    // (2026-09-04 Car App Library 실험은 실패로 제거: app-automotive의 CarAppActivity도 우리 패키지에서
    //  실행돼 사이드로드 DO 게이트에 똑같이 걸림 — 에뮬레이터에서 is_root_activity_do=false로 차단 확인)
}
